<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prática Tailwind - Dia 2 [Atividade 5]</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">

  <!-- Card centralizado -->
  <div class="max-w-sm mx-auto mt-10 bg-white rounded-2xl shadow-lg overflow-hidden border border-green-200">

    <!-- Imagem no topo -->
    <img
      src="https://cdn.pixabay.com/photo/2014/01/03/20/19/competition-238261_1280.jpg"
      alt="Prêmio IEL 2026"
      class="w-full h-48 object-cover"
    />

    <!-- Conteúdo -->
    <div class="p-6 space-y-3">
      <h2 class="text-2xl font-bold text-green-800">
        Prêmio IEL 2026
      </h2>

      <p class="text-gray-700 text-base">
        O IFRN foi reconhecido com o Prêmio IEL 2026 por seu destaque em
        inovação e excelência na formação de estudantes, consolidando sua
        posição como referência em educação técnica e tecnológica no
        estado.
      </p>

      <!-- Badges -->
      <div class="flex flex-wrap gap-2 pt-2">
        <span class="bg-green-100 text-green-800 text-sm font-medium px-3 py-1 rounded-full">
          🏆 1º Lugar
        </span>
        <span class="bg-green-100 text-green-800 text-sm font-medium px-3 py-1 rounded-full">
          Inovação
        </span>
        <span class="bg-green-100 text-green-800 text-sm font-medium px-3 py-1 rounded-full">
          Destaque Institucional
        </span>
      </div>
    </div>

  </div>

</body>
</html>
