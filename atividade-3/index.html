<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atividade 3</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

  <div class="max-w-sm rounded shadow p-4 bg-white border space-y-4">
    
    <img 
      src="neymar-jr.jpg" 
      alt="Neymar usando máscara do Batman e segurando chuteiras" 
      class="w-full h-80 object-cover rounded"
    >

    <h2 class="text-xl font-bold text-gray-800">
      Neymar Batman
    </h2>

    <p class="text-gray-600 text-sm">
      Neymar Jr. surge caracterizado com uma máscara do Batman, exibindo um sorriso vibrante enquanto segura um par de chuteiras temáticas pretas com detalhes em vermelho e o símbolo do Homem-Morcego.
    </p>

    <button class="bg-blue-500 hover:bg-blue-700 text-white px-4 py-2 rounded transition-colors duration-200">
      Saiba Mais
    </button>

  </div>

</body>
</html>
